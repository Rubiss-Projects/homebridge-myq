name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release tag and merged commit
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - name: Build release artifact
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its assets."
            exit 1
          fi
          gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: release/*.tgz
          retention-days: 30
  npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - run: npm install -g npm@11
      - name: Publish the tested tarball using npm trusted publishing
        run: npm publish release/*.tgz --access public --provenance --ignore-scripts
